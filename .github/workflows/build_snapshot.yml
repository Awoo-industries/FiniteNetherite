name: Snapshot build

on:
  workflow_dispatch:
  schedule:
    - cron: '0 10 * * *' # Daily 10:00 UTC

jobs:
  snapshot:
    uses: Beeps-Workshop/.github/.github/workflows/snapshot.yml@main
    with:
      build-system: maven
      project: fn
      jar-glob: target/finiteNetherite-*.jar
      loaders: |
        paper
        spigot
        folia
      game-versions: |
        1.21.1
        1.21.2
        1.21.3
        1.21.4
        1.21.5
        1.21.6
        1.21.7
        1.21.8
        1.21.9
        1.21.10
        1.21.11
        26.1
        26.1.1
        26.1.2
        26.2
      java-version: '17'
      force: ${{ github.event_name == 'workflow_dispatch' }}
    secrets: inherit
